name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./... -v -count=1 -race -shuffle=on

  release:
    name: Release
    needs: [test]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # windows/arm64 is less common; skip to keep matrix lean
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="task-driver-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags="-s -w" -o "dist/${BINARY}" .
          echo "binary=dist/${BINARY}" >> $GITHUB_ENV

      - name: Generate checksum
        working-directory: dist
        run: |
          BINARY="task-driver-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          sha256sum "${BINARY}" > "${BINARY}.sha256"
          echo "checksum=${BINARY}.sha256" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-driver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  source:
    name: Source Archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix=task-driver/ -o "dist/task-driver-source.tar.gz" HEAD
          cd dist
          sha256sum task-driver-source.tar.gz > task-driver-source.tar.gz.sha256

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: task-driver-source
          path: dist/*

  github-release:
    name: GitHub Release
    needs: [release, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          echo "## Task Driver Release" > release-notes.md
          echo "" >> release-notes.md
          echo "### Artifacts" >> release-notes.md
          echo "" >> release-notes.md
          find artifacts -type f \( -name "*.sha256" \) | while read f; do
            cat "$f" >> release-notes.md
            echo "" >> release-notes.md
          done
          echo "### Build Info" >> release-notes.md
          echo "- Go $(go version | cut -d' ' -f3)" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/task-driver-*-*
          fail_on_unmatched_files: true
