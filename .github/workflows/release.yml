name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test ./... -v -count=1 -race -shuffle=on

  source:
    name: Source Archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source tarball
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix=task-driver/ \
            -o "dist/task-driver-source.tar.gz" HEAD
          cd dist
          sha256sum task-driver-source.tar.gz > task-driver-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build linux-${{ matrix.arch }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cross-compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/task-driver-linux-${{ matrix.arch }}" .
          file dist/task-driver-linux-${{ matrix.arch }}

      - name: Checksum
        working-directory: dist
        run: sha256sum task-driver-linux-${{ matrix.arch }} | tee task-driver-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-darwin:
    name: Build darwin-${{ matrix.arch }}
    needs: [test]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: clang
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/task-driver-darwin-${{ matrix.arch }}" .
          file dist/task-driver-darwin-${{ matrix.arch }}

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 task-driver-darwin-${{ matrix.arch }} | tee task-driver-darwin-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: build-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build windows-amd64
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/task-driver-windows-amd64.exe" .
          file dist/task-driver-windows-amd64.exe

      - name: Checksum
        working-directory: dist
        run: sha256sum task-driver-windows-amd64.exe | tee task-driver-windows-amd64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [source, build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect artifacts
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          echo "=== Collected files ==="
          ls -la upload/

      - name: Generate release notes
        run: |
          cat > upload/RELEASE_NOTES.md << 'HEADER'
          ## Artifact Checksums

          HEADER
          for f in upload/*.sha256; do
            [ -f "$f" ] && echo "- $(cat "$f")" >> upload/RELEASE_NOTES.md
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: upload/RELEASE_NOTES.md
          files: |
            upload/*
          fail_on_unmatched_files: true
          generate_release_notes: false
